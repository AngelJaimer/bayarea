<div id="gate">

<script>
(async function () {
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const REAL_HASH = "a8eb56bf25f9eb51316df64d3d6880afb50436a3d5a38edc67b8c14336d24bb3";
  const SESSION_KEY = "peninsula-unlocked";

  const gate = document.getElementById("gate");
  const root = document.getElementById("root");
  const input = document.getElementById("pw");
  const btn = document.getElementById("pwBtn");
  const err = document.getElementById("pwErr");

  function unlock() {
    gate.classList.add("hidden");
    root.classList.add("visible");
    window.__mountApp && window.__mountApp();
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlock();
  }

  async function tryUnlock() {
    const val = input.value.trim();
    const h = await sha256(val);
    if (h === REAL_HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      unlock();
    } else {
      err.textContent = "Wrong code, try again.";
      input.value = "";
      input.focus();
    }
  }

  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  input.focus();
})();
</script>

const COAST = [
  [37.62, -122.51], [37.575, -122.515], [37.535, -122.513], [37.505, -122.50],
  [37.478, -122.465], [37.452, -122.443], [37.41, -122.425], [37.35, -122.405],
  [37.30, -122.397], [37.245, -122.412], [37.185, -122.393], [37.12, -122.315],
  [37.05, -122.16], [36.98, -122.03], [36.95, -121.92],
];
const ROADS = [
  { id: "101", pts: [[37.62,-122.39],[37.58,-122.35],[37.545,-122.305],[37.50,-122.24],[37.47,-122.19],[37.445,-122.145],[37.42,-122.10],[37.40,-122.05],[37.37,-121.99],[37.345,-121.94],[37.31,-121.885]] },
  { id: "280", pts: [[37.62,-122.44],[37.575,-122.40],[37.535,-122.36],[37.495,-122.315],[37.455,-122.275],[37.415,-122.225],[37.375,-122.17],[37.345,-122.105],[37.325,-122.03],[37.315,-121.955],[37.305,-121.89]] },
  { id: "92",  pts: [[37.558,-122.30],[37.545,-122.35],[37.515,-122.41],[37.494,-122.455]] },
  { id: "84",  pts: [[37.462,-122.20],[37.435,-122.245],[37.405,-122.29],[37.365,-122.345],[37.325,-122.40]] },
  { id: "85",  pts: [[37.425,-122.095],[37.395,-122.065],[37.355,-122.035],[37.315,-122.005],[37.28,-121.965],[37.255,-121.945]] },
  { id: "17",  pts: [[37.285,-121.945],[37.245,-121.975],[37.185,-121.985],[37.105,-122.005],[37.03,-122.025],[36.975,-122.02]] },
];

const LAT0 = 36.94, LAT1 = 37.635, LNG0 = -122.545, LNG1 = -121.865;
const VW = 700, VH = 1000;
const px = (lng) => ((lng - LNG0) / (LNG1 - LNG0)) * VW;
const py = (lat) => ((LAT1 - lat) / (LAT1 - LAT0)) * VH;
const path = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${px(p[1]).toFixed(1)} ${py(p[0]).toFixed(1)}`).join(" ");

const money = (n) => "$" + n.toLocaleString();

const DEFAULT_WEIGHTS = CRITERIA.map((c) => Math.round(c.w * 100));

function PeninsulaChart() {
  const [weights, setWeights] = useState(() => DEFAULT_WEIGHTS.slice());
  const [rentCap, setRentCap] = useState(9000);
  const [driveCap, setDriveCap] = useState(40);
  const [sel, setSel] = useState(null);
  const [compare, setCompare] = useState([]);
  const [tuning, setTuning] = useState(false);
  const listRef = useRef(null);

  const activeIdx = useMemo(() => weights.map((v, i) => (v > 0 ? i : -1)).filter((i) => i >= 0), [weights]);

  const scored = useMemo(() => {
    const wsum = activeIdx.reduce((a, i) => a + weights[i], 0);
    return PLACES.map((p) => {
      const score = wsum ? activeIdx.reduce((a, i) => a + p.s[i] * weights[i], 0) / wsum : 0;
      const ranked = activeIdx.map((i) => ({ i, v: p.s[i], w: weights[i] })).sort((a, b) => (b.v - a.v) || (b.w - a.w));
      const strong = ranked.slice(0, 2).map((r) => CRITERIA[r.i].l);
      const weak = ranked.slice(-2).map((r) => CRITERIA[r.i].l).reverse();
      return { ...p, score, strong, weak };
    }).sort((a, b) => b.score - a.score);
  }, [activeIdx, weights]);

  const visible = useMemo(
    () => scored.filter((p) => p.rl <= rentCap && p.wm <= driveCap * 0.72),
    [scored, rentCap, driveCap]
  );
  const visibleNames = useMemo(() => new Set(visible.map((v) => v.n)), [visible]);

  const lo = visible.length ? Math.min(...visible.map((v) => v.score)) : 0;
  const hi = visible.length ? Math.max(...visible.map((v) => v.score)) : 1;
  const norm = (s) => (hi === lo ? 1 : (s - lo) / (hi - lo));

  const selected = sel ? visible.find((v) => v.n === sel) || scored.find((v) => v.n === sel) : null;
  const compareRows = compare.map((n) => scored.find((v) => v.n === n)).filter(Boolean);

  const toggle = (i) => setWeights((w) => w.map((v, j) => (j === i ? (v > 0 ? 0 : DEFAULT_WEIGHTS[i]) : v)));
  const only = (i) => setWeights(DEFAULT_WEIGHTS.map((d, j) => (j === i ? d : 0)));
  const allOn = () => setWeights(DEFAULT_WEIGHTS.slice());
  const setWeight = (i, val) => setWeights((w) => w.map((v, j) => (j === i ? val : v)));
  const weightSum = weights.reduce((a, v) => a + v, 0);

  const toggleCompare = (name) => {
    setCompare((c) => (c.includes(name) ? c.filter((n) => n !== name) : c.length >= 5 ? c : [...c, name]));
  };

  const pick = (name) => {
    setSel((s) => (s === name ? null : name));
    if (listRef.current) {
      const el = listRef.current.querySelector(`[data-n="${CSS.escape(name)}"]`);
      if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  };

  return (
    <div style={{ background: C.ink, minHeight: "100vh", color: C.bone }}>
      <style>{CSS_TEXT}</style>

      <header className="hd">
        <div className="eyebrow">Relocation chart · 68 stations · Aug 2026</div>
        <h1>Where to land<span className="dot" /></h1>
        <p className="sub">
          Every neighbourhood plotted against Waymo HQ. Tune how much each criterion
          matters and the whole chart re-sorts live. Click up to 5 rows to compare
          them side by side.
        </p>
      </header>

      <section className="ctl">
        <div className="ctl-hd">
          <span className="lbl">Criteria in play</span>
          <div className="ctl-actions">
            <button className="reset" onClick={() => setTuning((t) => !t)}>
              {tuning ? "Hide weight tuning" : "Tune weights"}
            </button>
            <button className="reset" onClick={allOn}>
              Reset to defaults
            </button>
          </div>
        </div>
        <div className="chips">
          {CRITERIA.map((c, i) => (
            <button
              key={c.k}
              className={"chip" + (weights[i] > 0 ? " chip-on" : "")}
              onClick={() => toggle(i)}
              onDoubleClick={() => only(i)}
              title="Tap to include or exclude. Double tap for this one alone. Tune weights for finer control."
            >
              {c.l}
              <em>{weights[i]}</em>
            </button>
          ))}
        </div>

        {tuning && (
          <div className="weightform">
            <div className="weightform-hd">
              <span className="lbl">Set how much each criterion matters</span>
              <span className="compare-hint">Drag any slider — scores recompute live, weights don't need to add to 100.</span>
            </div>
            <div className="weightgrid">
              {CRITERIA.map((c, i) => (
                <label key={c.k} className="wf-row">
                  <span className="wf-label">{c.l}</span>
                  <input
                    type="range" min={0} max={40} step={1}
                    value={weights[i]} onChange={(e) => setWeight(i, +e.target.value)}
                  />
                  <span className="wf-val">
                    {weights[i]}
                    <em>{weightSum ? Math.round((weights[i] / weightSum) * 100) : 0}%</em>
                  </span>
                </label>
              ))}
            </div>
          </div>
        )}

        <div className="sliders">
          <label>
            <span>
              Rent ceiling <b>{money(rentCap)}</b>
            </span>
            <input
              type="range" min={4000} max={12000} step={250}
              value={rentCap} onChange={(e) => setRentCap(+e.target.value)}
            />
          </label>
          <label>
            <span>
              Drive to Waymo under <b>{driveCap} min</b>
            </span>
            <input
              type="range" min={10} max={70} step={5}
              value={driveCap} onChange={(e) => setDriveCap(+e.target.value)}
            />
          </label>
        </div>
        <div className="count">
          {visible.length} of {PLACES.length} stations pass
          {activeIdx.length < CRITERIA.length && ` · scoring on ${activeIdx.length} criteria`}
          {compare.length > 0 && ` · ${compare.length} pinned to compare`}
        </div>
      </section>

      <div className="split">
        <div className="mapwrap">
          <svg viewBox={`0 0 ${VW} ${VH}`} className="chart" role="img" aria-label="Map of Peninsula neighbourhoods">
            <defs>
              <radialGradient id="halo">
                <stop offset="0%" stopColor={C.amber} stopOpacity="0.5" />
                <stop offset="100%" stopColor={C.amber} stopOpacity="0" />
              </radialGradient>
            </defs>

            <path d={path(BAY) + " Z"} fill={C.water} stroke={C.teal} strokeWidth="1" opacity="0.75" />
            <path d={path(COAST)} fill="none" stroke={C.teal} strokeWidth="1.4" opacity="0.8" />

            {ROADS.map((r) => (
              <g key={r.id}>
                <path d={path(r.pts)} fill="none" stroke={C.grid} strokeWidth="1" strokeDasharray="5 5" />
                <text x={px(r.pts[0][1])} y={py(r.pts[0][0]) - 6} className="rd">{r.id}</text>
              </g>
            ))}

            {selected && (
              <line
                x1={px(selected.lng)} y1={py(selected.lat)}
                x2={px(WAYMO.lng)} y2={py(WAYMO.lat)}
                stroke={C.amber} strokeWidth="1.2" strokeDasharray="3 4" opacity="0.9"
              />
            )}

            {scored.map((p) => {
              const shown = visibleNames.has(p.n);
              const isSel = sel === p.n;
              const r = shown ? 3.2 + norm(p.score) * 7.5 : 2;
              return (
                <g key={p.n} onClick={() => pick(p.n)} style={{ cursor: "pointer" }}>
                  {isSel && <circle cx={px(p.lng)} cy={py(p.lat)} r={26} fill="url(#halo)" />}
                  <circle
                    cx={px(p.lng)} cy={py(p.lat)} r={r + 6} fill="transparent"
                  />
                  <circle
                    cx={px(p.lng)} cy={py(p.lat)} r={r}
                    fill={shown ? (isSel ? C.amber : C.dot) : "none"}
                    stroke={shown ? (isSel ? C.bone : C.dotEdge) : C.faint}
                    strokeWidth={isSel ? 1.6 : 1}
                    opacity={shown ? 1 : 0.45}
                  />
                </g>
              );
            })}

            <g>
              <circle cx={px(WAYMO.lng)} cy={py(WAYMO.lat)} r="6" fill="none" stroke={C.bone} strokeWidth="1.4" />
              <circle cx={px(WAYMO.lng)} cy={py(WAYMO.lat)} r="1.8" fill={C.bone} />
              <text x={px(WAYMO.lng) + 11} y={py(WAYMO.lat) + 3} className="hq">WAYMO HQ</text>
            </g>

            {selected && (
              <text
                x={px(selected.lng)} y={py(selected.lat) - (3.2 + norm(selected.score) * 7.5) - 8}
                className="pin" textAnchor="middle"
              >
                {selected.n.split(" / ")[0].toUpperCase()}
              </text>
            )}
          </svg>
          <div className="legend">
            Dot size is the score under your current criteria. Hollow dots fail the rent
            or drive filter. Tap a dot for the detail.
          </div>
        </div>

        <div className="side">
          {selected && (
            <div className="card">
              <button className="close" onClick={() => setSel(null)} aria-label="Close">×</button>
              <div className="eyebrow">{selected.c}</div>
              <h2>{selected.n}</h2>
              <div className="stats">
                <div><em>{selected.score.toFixed(2)}</em><span>score</span></div>
                <div><em>{selected.wd.split("-")[0]}′</em><span>to Waymo · {selected.wm} mi</span></div>
                <div><em>{selected.bd.split("-")[0].replace(" min", "")}{selected.bd.includes("min") ? "′" : ""}</em><span>to {selected.b.split(" via")[0]}</span></div>
              </div>
              <div className="rent">{money(selected.rl)} – {money(selected.rh)} <span>3BR house, per month</span></div>
              <p className="note">{selected.note}</p>
              <div className="strengths">
                <div><span>Best for</span><em className="good">{selected.strong.join(" + ")}</em></div>
                <div><span>Weakest on</span><em className="bad">{selected.weak.join(" + ")}</em></div>
              </div>
              <div className="bars">
                {CRITERIA.map((c, i) => (
                  <div key={c.k} className={"bar" + (weights[i] > 0 ? "" : " bar-off")}>
                    <span className="bl">{c.l}</span>
                    <span className="bt"><i style={{ width: (selected.s[i] / 5) * 100 + "%" }} /></span>
                    <span className="bv">{selected.s[i].toFixed(1)}</span>
                  </div>
                ))}
              </div>
              <button className="reset" onClick={() => toggleCompare(selected.n)}>
                {compare.includes(selected.n) ? "Remove from compare" : "Add to compare"}
              </button>
            </div>
          )}

          <div className="listhd">Ranked under your criteria</div>
          <ol className="list" ref={listRef}>
            {visible.map((p, i) => (
              <li
                key={p.n} data-n={p.n}
                className={"row" + (sel === p.n ? " row-sel" : "")}
                onClick={() => pick(p.n)}
              >
                <span className="rk">{String(i + 1).padStart(2, "0")}</span>
                <span className="nm">
                  {p.n}
                  <em>{p.c} · {money(p.rl)}–{money(p.rh)} · {p.wd} to Waymo</em>
                </span>
                <span className="sc">{p.score.toFixed(2)}</span>
              </li>
            ))}
            {!visible.length && (
              <li className="empty">Nothing passes. Raise the rent ceiling or the drive limit.</li>
            )}
          </ol>
        </div>
      </div>

      {compareRows.length > 0 && (
        <section className="compare">
          <div className="compare-hd">
            <span className="lbl">Comparing {compareRows.length}</span>
            <span className="compare-hint">Click a name on the left to add or remove it here.</span>
          </div>
          <div className="compare-wrap">
            <table className="cmp">
              <thead>
                <tr>
                  <th></th>
                  <th>Neighbourhood</th>
                  <th>Score</th>
                  <th>Rent</th>
                  <th>To Waymo</th>
                  <th>To beach</th>
                  {CRITERIA.map((c) => <th key={c.k}>{c.l}</th>)}
                </tr>
              </thead>
              <tbody>
                {compareRows.map((p) => (
                  <tr key={p.n}>
                    <td><button className="cmp-x" onClick={() => toggleCompare(p.n)} aria-label="Remove">×</button></td>
                    <td className="name">{p.n}<br /><span style={{ color: C.mute, fontSize: "11px" }}>{p.c}</span></td>
                    <td className="num">{p.score.toFixed(2)}</td>
                    <td className="num">{money(p.rl)}–{money(p.rh)}</td>
                    <td className="num">{p.wd}</td>
                    <td className="num">{p.bd}</td>
                    {CRITERIA.map((c, i) => <td key={c.k} className="num">{p.s[i].toFixed(1)}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      <footer className="ft">
        Scores are comparative planning judgements, not measured data. Distances are
        estimated from 680 E Middlefield Rd. Rent bands are area-level figures from
        August 2026 listings, not quotes.
      </footer>
    </div>
  );
}

window.__mountApp = function () {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(PeninsulaChart));
};
</script>

<script>
(function () {
  const src = document.getElementById("app-source").textContent;
  const out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  const fn = new Function(out);
  fn();
})();
</script>
</body>
</html>
